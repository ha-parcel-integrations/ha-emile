name: 🏷️ Unrecognised parcel status
description: The integration logged a warning asking you to report an unrecognised status or event.
title: "[status] "
labels: ["unrecognised-status"]
assignees:
  - peter-mdf
body:
  - type: markdown
    attributes:
      value: |
        The integration logs a warning such as

        ```
        Unrecognised eMile status — help us map it. Open an issue
        and paste this line: …
          status=… → not used for the parcel status
        ```

        Paste that full line below and we'll add it to the mapping.
  - type: textarea
    id: logline
    attributes:
      label: The log line
      description: Copy the full "help us map it" warning line from your Home Assistant log.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "e.g. 2.6.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.7.0"
